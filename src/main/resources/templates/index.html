<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Complaint Management System</title>
    
    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Modern CSS Framework -->
    <link rel="stylesheet" href="/css/modern.css">
    
    <style>
        /* Login Page Specific Styles with Glassmorphism */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 50%, #1E40AF 100%);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background elements */
        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.3) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }
        
        .login-container::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -30%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(8, 145, 178, 0.2) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, -30px) rotate(5deg); }
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
            position: relative;
            z-index: 1;
        }
        
        .login-header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 3rem;
            text-align: center;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .login-logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: fadeIn 0.8s ease-in;
            background: linear-gradient(135deg, #60A5FA 0%, #34D399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .login-subtitle {
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        .login-body {
            padding: 3rem;
            background: rgba(255, 255, 255, 0.95);
        }
        
        .login-form .form-group {
            margin-bottom: 1.5rem;
        }
        
        .login-form .form-label {
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .login-form .input-group {
            position: relative;
        }
        
        .login-form .input-group-text {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-right: none;
            padding: 1rem;
            color: #64748B;
            transition: all 0.3s ease;
        }
        
        .login-form .form-control {
            padding: 1rem;
            border: 2px solid #E2E8F0;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #F8FAFC;
        }
        
        .login-form .form-control:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: white;
        }
        
        .login-form .input-group:focus-within .input-group-text {
            border-color: #2563EB;
            background: white;
        }
        
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2563EB 0%, #1E40AF 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        
        .login-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }
        
        .login-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }
        
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .login-footer {
            padding: 2rem;
            background: rgba(248, 250, 252, 0.95);
            text-align: center;
            border-top: 1px solid #E2E8F0;
        }
        
        .login-footer a {
            color: #2563EB;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .login-footer a:hover {
            color: #1E40AF;
            transform: translateY(-2px);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: #64748B;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E2E8F0;
        }
        
        .divider span {
            padding: 0 1rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2563EB;
        }
        
        .remember-me label {
            font-size: 0.9rem;
            color: #64748B;
            cursor: pointer;
            font-weight: 500;
        }
        
        .forgot-password {
            font-size: 0.9rem;
            color: #2563EB;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .forgot-password:hover {
            color: #1E40AF;
            text-decoration: underline;
        }
        
        .back-to-landing {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
        }
        
        .back-to-landing a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .back-to-landing a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .login-card {
                border-radius: 1rem;
            }
            
            .login-container {
                padding: 1rem;
            }
            
            .back-to-landing {
                top: 1rem;
                left: 1rem;
            }
            
            .login-header {
                padding: 2rem;
            }
            
            .login-body {
                padding: 2rem;
            }
            
            .login-title {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 576px) {
            .login-card {
                border-radius: 0;
                box-shadow: none;
            }
            
            .login-container {
                padding: 0;
                align-items: flex-start;
            }
            
            .back-to-landing {
                position: fixed;
                top: auto;
                bottom: 1rem;
                left: 1rem;
                right: 1rem;
            }
            
            .back-to-landing a {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="back-to-landing">
            <a href="landing.html">
                <i class="bi bi-arrow-left"></i>
                Back to Home
            </a>
        </div>
        
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="bi bi-box-seam"></i>
                </div>
                <h1 class="login-title">SCMS</h1>
                <p class="login-subtitle">Smart Complaint Management System</p>
            </div>
            
            <div class="login-body">
                <div id="alert" class="alert"></div>
                
                <form id="loginForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="email" name="email" 
                                   required placeholder="Enter your email" autocomplete="email">
                        </div>
                        <div class="invalid-feedback">Please enter a valid email address</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" 
                                   required placeholder="Enter your password" autocomplete="current-password">
                        </div>
                        <div class="invalid-feedback">Please enter your password</div>
                    </div>
                    
                    <div class="remember-forgot">
                        <div class="remember-me">
                            <input type="checkbox" id="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="/forgot-password.html" class="forgot-password">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="login-btn" id="loginButton">
                        <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
                        <span id="loginButtonText">Sign In</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
            </div>
            
            <div class="login-footer">
                <p style="margin-bottom: var(--spacing-sm); color: var(--text-secondary);">
                    Don't have an account?
                </p>
                <a href="/register.html" class="btn btn-outline-primary">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </a>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="bi bi-bell me-2" id="toastIcon"></i>
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
