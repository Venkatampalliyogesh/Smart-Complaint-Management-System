<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Complaint Management System</title>
    
    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Modern CSS Framework -->
    <link rel="stylesheet" href="/css/modern.css">
    
    <style>
        /* Forgot Password Page Specific Styles */
        .forgot-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563EB 0%, #1E40AF 100%);
            padding: 2rem;
        }
        
        .forgot-card {
            background: #FFFFFF;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        
        .forgot-header {
            background: linear-gradient(135deg, #2563EB 0%, #1E40AF 100%);
            padding: 3rem;
            text-align: center;
            color: white;
        }
        
        .forgot-logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: fadeIn 0.8s ease-in;
        }
        
        .forgot-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .forgot-subtitle {
            font-size: 0.875rem;
            opacity: 0.9;
        }
        
        .forgot-body {
            padding: 3rem;
        }
        
        .forgot-form .form-group {
            margin-bottom: 1.5rem;
        }
        
        .forgot-form .form-label {
            font-weight: 500;
            color: #1E293B;
        }
        
        .forgot-form .form-control {
            padding: 1rem;
            border: 1px solid #E2E8F0;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 150ms ease-in-out;
        }
        
        .forgot-form .form-control:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .forgot-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2563EB 0%, #1E40AF 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .forgot-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .forgot-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .forgot-footer {
            padding: 2rem;
            background-color: #F8FAFC;
            text-align: center;
            border-top: 1px solid #E2E8F0;
        }
        
        .forgot-footer a {
            color: #2563EB;
            text-decoration: none;
            font-weight: 500;
            transition: color 150ms ease-in-out;
        }
        
        .forgot-footer a:hover {
            color: #1E40AF;
            text-decoration: underline;
        }
        
        @media (max-width: 576px) {
            .forgot-card {
                border-radius: 0;
                box-shadow: none;
            }
            
            .forgot-container {
                padding: 0;
                align-items: flex-start;
            }
            
            .forgot-header {
                padding: 2rem;
            }
            
            .forgot-body {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="forgot-card">
            <div class="forgot-header">
                <div class="forgot-logo">
                    <i class="bi bi-key"></i>
                </div>
                <h1 class="forgot-title">Forgot Password</h1>
                <p class="forgot-subtitle">Reset your password in a few steps</p>
            </div>
            
            <div class="forgot-body">
                <div id="alert" class="alert"></div>
                
                <form id="forgotForm" class="forgot-form" novalidate>
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="email" name="email" 
                                   required placeholder="Enter your email" autocomplete="email">
                        </div>
                        <div class="invalid-feedback">Please enter a valid email address</div>
                    </div>
                    
                    <button type="submit" class="forgot-btn" id="forgotButton">
                        <span class="spinner-border spinner-border-sm d-none" id="forgotSpinner"></span>
                        <span id="forgotButtonText">Send Reset Link</span>
                        <i class="bi bi-send"></i>
                    </button>
                </form>
            </div>
            
            <div class="forgot-footer">
                <p style="margin-bottom: 1rem; color: #64748B;">
                    Remember your password?
                </p>
                <a href="/index.html" class="btn btn-outline-primary">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </a>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="bi bi-bell me-2" id="toastIcon"></i>
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
