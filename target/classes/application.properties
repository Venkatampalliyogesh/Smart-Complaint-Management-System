# ==========================================================
# APPLICATION CONFIGURATION
# ==========================================================
spring.application.name=Smart Complaint Management System
server.port=8080
server.servlet.context-path=/

# ==========================================================
# MYSQL DATABASE CONFIGURATION
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/scms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# JPA / HIBERNATE
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# ==========================================================
# JWT CONFIGURATION
# ==========================================================
app.jwt.secret=SCMSSecretKey2026SmartComplaintManagementSystemJWTAuthenticationSecretKey
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ==========================================================
# CORS CONFIGURATION
# ==========================================================
app.cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://localhost:4200,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
app.cors.max-age=3600

# ==========================================================
# SWAGGER CONFIGURATION
# ==========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# ==========================================================
# MAIL CONFIGURATION
# ==========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================================
# APPLICATION SETTINGS
# ==========================================================
app.frontend.url=http://localhost:8080
app.password-reset.expiration=3600000

# ==========================================================
# LOGGING
# ==========================================================
logging.level.root=INFO
logging.level.com.scms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

logging.file.name=logs/scms.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} : %msg%n

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ==========================================================
# THYMELEAF
# ==========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ==========================================================
# FILE UPLOAD
# ==========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB